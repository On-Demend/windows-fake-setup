<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Color Transition</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: none;
    background-color: #FF0000;
  }
</style>
</head>
<body>

<script>
  const colors = ['#FF0000', '#00FF00', '#0000FF', '#000000'];
  let index = 0;

  setInterval(() => {
    index = (index + 1) % colors.length;
    document.body.style.backgroundColor = colors[index];
  }, 2000);

  function openFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen().catch(() => {});
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen().catch(() => {});
    }
  }

  window.addEventListener('click', openFullscreen, { once: true });
  window.addEventListener('touchstart', openFullscreen, { once: true });
  window.addEventListener('keydown', openFullscreen, { once: true });

  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });
</script>
</body>
</html>
